<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enzo Coach Pro — Programmes Personnalisés</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bordeaux: #6B1B2E;
  --bordeaux-light: #8B2A3F;
  --bordeaux-dark: #4A1120;
  --bordeaux-pale: #F5E8EC;
  --bordeaux-mid: #C4596E;
  --cream: #FAF7F4;
  --dark: #1A0A0F;
  --gray: #8A7F82;
  --gray-light: #E8E2E4;
  --green: #2D6A4F;
  --green-light: #D8F3DC;
  --blue: #1A4A7A;
  --blue-light: #E3EEF9;
  --amber: #8B5E00;
  --amber-light: #FFF3CD;
  --trail: #5C4A1E;
  --trail-light: #F5EDD6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; }

/* HEADER */
header { background:var(--bordeaux-dark); color:white; position:sticky; top:0; z-index:100; box-shadow:0 2px 20px rgba(74,17,32,0.4); }
.header-inner { max-width:1100px; margin:0 auto; padding:0 2rem; display:flex; align-items:center; justify-content:space-between; height:64px; gap:1rem; }
.logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:0.05em; color:white; display:flex; align-items:center; gap:10px; flex-shrink:0; }
.logo-dot { color:var(--bordeaux-mid); }
.logo-icon { width:36px; height:36px; background:var(--bordeaux); border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* PROGRAM SELECTOR */
.prog-selector { display:flex; gap:6px; overflow-x:auto; padding:4px 0; }
.prog-selector::-webkit-scrollbar { display:none; }
.prog-btn { background:transparent; border:1.5px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.65); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; padding:6px 14px; border-radius:20px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.prog-btn:hover { color:white; border-color:rgba(255,255,255,0.5); }
.prog-btn.active { color:white; background:var(--bordeaux); border-color:var(--bordeaux); }

/* HERO */
.hero { color:white; padding:2.5rem 2rem 3.5rem; position:relative; overflow:hidden; transition:background 0.3s; }
.hero-inner { max-width:1100px; margin:0 auto; }
.hero-tag { display:inline-block; background:rgba(255,255,255,0.15); color:white; font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; padding:5px 14px; border-radius:20px; margin-bottom:1.25rem; }
.hero h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(38px,6vw,72px); letter-spacing:0.03em; line-height:0.95; margin-bottom:1rem; }
.hero h1 span { color:var(--bordeaux-mid); }
.hero-sub { font-size:14px; color:rgba(255,255,255,0.65); max-width:520px; line-height:1.7; margin-bottom:2rem; }
.hero-stats { display:flex; gap:1.75rem; flex-wrap:wrap; }
.hero-stat { display:flex; flex-direction:column; }
.hero-stat-val { font-family:'Bebas Neue',sans-serif; font-size:32px; color:white; line-height:1; }
.hero-stat-lbl { font-size:11px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.1em; margin-top:2px; }
.hero-divider { width:1px; height:36px; background:rgba(255,255,255,0.15); align-self:center; }
.hero-watermark { position:absolute; right:-10px; top:50%; transform:translateY(-50%); font-family:'Bebas Neue',sans-serif; font-size:160px; color:rgba(255,255,255,0.04); letter-spacing:-5px; pointer-events:none; }

/* MAIN NAV */
.main-nav { background:white; border-bottom:1px solid var(--gray-light); position:sticky; top:64px; z-index:90; }
.main-nav-inner { max-width:1100px; margin:0 auto; padding:0 2rem; display:flex; gap:0; }
.tab-btn { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--gray); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; padding:14px 18px; cursor:pointer; transition:all 0.2s; }
.tab-btn:hover { color:var(--dark); }
.tab-btn.active { color:var(--bordeaux); border-bottom-color:var(--bordeaux); }

/* MAIN */
main { max-width:1100px; margin:0 auto; padding:2rem; }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* WEEKS */
.phase-label { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.05em; color:var(--bordeaux); padding:1.5rem 0 0.5rem; border-bottom:2px solid var(--bordeaux-pale); margin-bottom:10px; display:flex; align-items:baseline; gap:12px; }
.phase-label span { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:400; color:var(--gray); letter-spacing:0; }
.weeks-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-bottom:1rem; }
.week-card { background:white; border:1.5px solid var(--gray-light); border-radius:14px; padding:1.15rem; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
.week-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--gray-light); transition:background 0.2s; }
.week-card:hover { border-color:var(--bordeaux-mid); transform:translateY(-2px); box-shadow:0 8px 24px rgba(107,27,46,0.1); }
.week-card:hover::before, .week-card.selected::before { background:var(--bordeaux); }
.week-card.selected { border-color:var(--bordeaux); }
.week-card.recovery-week { border-color:#B7DFC8; }
.week-card.recovery-week::before { background:var(--green); }
.week-num { font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:0.1em; color:var(--gray); margin-bottom:3px; }
.week-title-card { font-size:13px; font-weight:500; color:var(--dark); margin-bottom:8px; line-height:1.3; }
.week-sessions { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
.session-dot { width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; }
.dot-run { background:var(--bordeaux-pale); }
.dot-strength { background:var(--green-light); }
.dot-interval { background:var(--amber-light); }
.dot-long { background:var(--blue-light); }
.dot-trail { background:var(--trail-light); }
.dot-rest { background:var(--gray-light); }
.week-volume { font-family:'DM Mono',monospace; font-size:12px; color:var(--bordeaux); font-weight:500; }
.recovery-badge { display:inline-block; background:var(--green-light); color:var(--green); font-size:10px; font-weight:500; padding:2px 8px; border-radius:10px; margin-top:5px; }

/* DETAIL */
.detail-panel { display:none; background:white; border:1.5px solid var(--gray-light); border-radius:16px; padding:1.75rem; margin-bottom:1.5rem; animation:slideIn 0.2s ease; }
.detail-panel.visible { display:block; }
@keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.detail-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:1.25rem; padding-bottom:1.25rem; border-bottom:1px solid var(--gray-light); }
.detail-week-num { font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:0.1em; color:var(--gray); margin-bottom:3px; }
.detail-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:0.03em; color:var(--bordeaux-dark); }
.detail-close { background:var(--gray-light); border:none; width:30px; height:30px; border-radius:50%; font-size:14px; cursor:pointer; color:var(--gray); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.detail-close:hover { background:var(--bordeaux-pale); color:var(--bordeaux); }
.sessions-list { display:flex; flex-direction:column; gap:10px; }
.session-card { border:1px solid var(--gray-light); border-radius:12px; overflow:hidden; }
.session-header { display:flex; align-items:center; gap:10px; padding:0.75rem 1rem; border-bottom:1px solid var(--gray-light); flex-wrap:wrap; }
.session-type-badge { font-size:11px; font-weight:500; padding:3px 10px; border-radius:20px; white-space:nowrap; }
.type-run { background:var(--bordeaux-pale); color:var(--bordeaux-dark); }
.type-long { background:var(--blue-light); color:var(--blue); }
.type-interval { background:var(--amber-light); color:var(--amber); }
.type-strength { background:var(--green-light); color:var(--green); }
.type-trail { background:var(--trail-light); color:var(--trail); }
.type-rest { background:var(--gray-light); color:var(--gray); }
.session-day { font-size:12px; font-weight:500; color:var(--dark); }
.session-name { font-size:13px; font-weight:500; flex:1; }
.session-duration { font-family:'DM Mono',monospace; font-size:12px; color:var(--gray); margin-left:auto; }
.session-body { padding:0.85rem 1rem; }
.session-desc { font-size:13px; color:var(--gray); line-height:1.7; margin-bottom:8px; }
.session-details { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.session-detail-tag { background:var(--cream); border:1px solid var(--gray-light); border-radius:6px; padding:2px 9px; font-size:11px; color:var(--dark); }
.strength-block { background:var(--green-light); border-radius:10px; padding:0.85rem; margin-top:6px; }
.strength-block-title { font-size:12px; font-weight:500; color:var(--green); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; }
.exercises-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.exercise-item { background:white; border-radius:7px; padding:7px 9px; font-size:12px; color:var(--dark); }
.exercise-name { font-weight:500; display:block; }
.exercise-sets { color:var(--green); font-size:11px; display:block; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:1.5rem; }
.stat-big { background:white; border:1.5px solid var(--gray-light); border-radius:14px; padding:1.25rem; }
.stat-big-val { font-family:'Bebas Neue',sans-serif; font-size:40px; color:var(--bordeaux); line-height:1; }
.stat-big-unit { font-size:14px; color:var(--bordeaux-mid); }
.stat-big-lbl { font-size:12px; color:var(--gray); margin-top:4px; }
.progression-chart { background:white; border:1.5px solid var(--gray-light); border-radius:14px; padding:1.25rem; margin-bottom:1.25rem; }
.chart-title { font-size:13px; font-weight:500; margin-bottom:1rem; }
.chart-bars { display:flex; align-items:flex-end; gap:5px; height:110px; }
.chart-bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; height:100%; justify-content:flex-end; }
.chart-bar { width:100%; border-radius:4px 4px 0 0; background:var(--bordeaux-pale); border:1px solid var(--bordeaux-mid); min-height:4px; }
.chart-bar.recovery { background:var(--green-light); border-color:#97C459; }
.chart-bar-lbl { font-size:9px; color:var(--gray); font-family:'DM Mono',monospace; }
.chart-bar-km { font-size:9px; color:var(--bordeaux); font-family:'DM Mono',monospace; }

/* TIPS */
.tip-card { background:white; border:1.5px solid var(--gray-light); border-radius:14px; padding:1.1rem 1.35rem; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
.tip-icon { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.tip-title { font-size:13px; font-weight:500; margin-bottom:3px; }
.tip-text { font-size:13px; color:var(--gray); line-height:1.7; }

/* PROFIL */
.profil-card { background:var(--bordeaux-dark); color:white; border-radius:16px; padding:1.75rem; margin-bottom:1.25rem; display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
.profil-field { display:flex; flex-direction:column; gap:3px; }
.profil-label { font-size:11px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.1em; }
.profil-value { font-size:15px; font-weight:500; }

.section-intro { font-size:13px; color:var(--gray); margin-bottom:1.25rem; line-height:1.7; }

@media (max-width:600px) {
  .weeks-grid { grid-template-columns:1fr 1fr; }
  .exercises-grid { grid-template-columns:1fr; }
  .profil-card { grid-template-columns:1fr; }
  .hero-watermark { display:none; }
  .header-inner { padding:0 1rem; }
  main { padding:1rem; }
  .prog-btn { font-size:11px; padding:5px 10px; }
}

.nutri-section{margin-bottom:2rem}
.nutri-section-title{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:.05em;color:var(--bordeaux);padding:1rem 0 .75rem;border-bottom:2px solid var(--bordeaux-pale);margin-bottom:1rem}
.nutri-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.nutri-card{background:white;border:1.5px solid var(--gray-light);border-radius:14px;overflow:hidden}
.nutri-card-header{padding:.85rem 1rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--gray-light)}
.nutri-card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--blue-light)}
.nutri-card-title{font-size:13px;font-weight:500;flex:1}
.nutri-card-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;background:#E3EEF9;color:var(--blue);white-space:nowrap}
.nutri-card-body{padding:.85rem 1rem}
.nutri-card-desc{font-size:13px;color:var(--gray);line-height:1.7;margin-bottom:8px}
.nutri-tags{display:flex;flex-wrap:wrap;gap:5px}
.nutri-tag{background:var(--cream);border:1px solid var(--gray-light);border-radius:6px;padding:2px 9px;font-size:11px;color:var(--dark)}
.nutri-timeline{display:flex;flex-direction:column}
.nutri-timeline-item{display:flex;gap:14px;padding:.85rem 0;border-bottom:1px solid var(--gray-light)}
.nutri-timeline-item:last-child{border-bottom:none}
.nutri-timeline-time{font-family:"DM Mono",monospace;font-size:11px;color:var(--bordeaux);font-weight:500;min-width:75px;padding-top:2px;flex-shrink:0}
.nutri-timeline-title{font-size:13px;font-weight:500;margin-bottom:3px}
.nutri-timeline-desc{font-size:12px;color:var(--gray);line-height:1.6}
.nutri-alert{background:var(--bordeaux-pale);border-left:3px solid var(--bordeaux);border-radius:0 10px 10px 0;padding:.85rem 1rem;margin-bottom:1.5rem;font-size:13px;color:var(--bordeaux-dark);line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">
        <svg style="width:20px;height:20px;" viewBox="0 0 24 24"><polygon points="13,2 4,14 11,14 11,22 20,10 13,10" fill="white"/></svg>
      </div>
      ENZO<span class="logo-dot">·</span>COACH PRO
    </div>
    <div class="prog-selector" id="prog-selector">
      <button class="prog-btn active" onclick="switchProg('marathon',this)">🏁 Marathon Route</button>
      <button class="prog-btn" onclick="switchProg('marathon_trail',this)">⛰️ Marathon Trail</button>
      <button class="prog-btn" onclick="switchProg('semi',this)">🏔️ 21km Trail</button>
      <button class="prog-btn" onclick="switchProg('10k',this)">⚡ 10km</button>
    </div>
  </div>
</header>

<!-- HERO dynamique -->
<div class="hero" id="hero" style="background:var(--bordeaux-dark);">
  <div class="hero-watermark" id="hero-watermark">42.195</div>
  <div class="hero-inner">
    <div class="hero-tag" id="hero-tag">Programme Personnalisé · 12 Semaines · Enzo Coach Pro</div>
    <h1 id="hero-title">MARATHON<br><span>SUB 4H00</span></h1>
    <p class="hero-sub" id="hero-sub">Programme adapté à votre niveau avancé, basé sur votre chrono de 4h26 et votre allure actuelle de 6:30/km.</p>
    <div class="hero-stats" id="hero-stats"></div>
  </div>
</div>

<div class="main-nav">
  <div class="main-nav-inner">
    <button class="tab-btn active" onclick="showTab('programme',this)">Programme</button>
    <button class="tab-btn" onclick="showTab('stats',this)">Progression</button>
    <button class="tab-btn" onclick="showTab('conseils',this)">Conseils</button>
    <button class="tab-btn" onclick="showTab('profil',this)">Profil</button>
    <button class="tab-btn" onclick="showTab('nutrition',this)">Nutrition &#127829;</button>
  </div>
</div>

<main>
  <div class="tab-content active" id="tab-programme">
    <p class="section-intro" id="prog-intro">Cliquez sur une semaine pour voir le détail des séances.</p>
    <div id="detail-panel" class="detail-panel"></div>
    <div class="weeks-grid" id="weeks-grid"></div>
  </div>

  <div class="tab-content" id="tab-stats">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="progression-chart">
      <div class="chart-title">Volume hebdomadaire (km)</div>
      <div class="chart-bars" id="volume-chart"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-conseils">
    <div id="conseils-content"></div>
  </div>

  <div class="tab-content" id="tab-nutrition">
    <div id="nutrition-content"></div>
  </div>
  <div class="tab-content" id="tab-profil">
    <div id="profil-content"></div>
  </div>
</main>

<script>
// ─── DONNÉES PROGRAMMES ───────────────────────────────────────────────────────

      { icon:"😴", bg:"#FFF3CD", title:"Le sommeil, 1ère performance", text:"Visez 8h par nuit. Les nuits J-3 et J-2 comptent plus que la nuit avant la course. Le corps s'adapte pendant le sommeil." },

let currentProg = "marathon";
let activeTabBtn = null;

function switchProg(id, btn) {
  currentProg = id;
  document.querySelectorAll(".prog-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const prog = PROGRAMS[id];

  // Hero
  document.getElementById("hero-title").innerHTML = prog.heroTitle;
  document.getElementById("hero-sub").textContent = prog.heroSub;
  document.getElementById("hero-watermark").textContent = prog.heroWatermark;

  // Hero stats
  const statsEl = document.getElementById("hero-stats");
  statsEl.innerHTML = prog.heroStats.map((s, i) =>
    (i > 0 ? "<div class=\"hero-divider\"></div>" : "") +
    `<div class="hero-stat"><span class="hero-stat-val">${s.val}</span><span class="hero-stat-lbl">${s.lbl}</span></div>`
  ).join("");

  // Reset to programme tab
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-programme").classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(".tab-btn").classList.add("active");

  renderAll();
}

function showTab(name, btn) {
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  btn.classList.add("active");
}

function renderNutrition() {
  var progKey = currentProg === "10k" ? "k10" : currentProg;
  var n = NUTRITION[progKey];
  var el = document.getElementById("nutrition-content");
  if (!n || !el) return;

  var cards = n.training.map(function(t) {
    var tags = t.tags.map(function(tag) { return '<span class="nutri-tag">' + tag + '</span>'; }).join("");
    return '<div class="nutri-card">' +
      '<div class="nutri-card-header">' +
        '<div class="nutri-card-icon">' + t.icon + '</div>' +
        '<span class="nutri-card-title">' + t.weeks + ' — ' + t.title + '</span>' +
        '<span class="nutri-card-badge">Entraînement</span>' +
      '</div>' +
      '<div class="nutri-card-body">' +
        '<div class="nutri-card-desc">' + t.desc + '</div>' +
        '<div class="nutri-tags">' + tags + '</div>' +
      '</div></div>';
  }).join("");

  var tl = n.timeline.map(function(r) {
    return '<div class="nutri-timeline-item">' +
      '<div class="nutri-timeline-time">' + r.time + '</div>' +
      '<div class="nutri-timeline-content">' +
        '<div class="nutri-timeline-title">' + r.title + '</div>' +
        '<div class="nutri-timeline-desc">' + r.desc + '</div>' +
      '</div></div>';
  }).join("");

  el.innerHTML =
    '<div class="nutri-alert"><strong>&#x1F4A1; Profil nutritionnel :</strong> ' + n.alert + '</div>' +
    '<div class="nutri-section">' +
      '<div class="nutri-section-title">&#x1F3CB; Entraînements Nutritionnels</div>' +
      '<div class="nutri-grid">' + cards + '</div>' +
    '</div>' +
    '<div class="nutri-section">' +
      '<div class="nutri-section-title">&#x1F4C5; Protocole Course — De J-7 au Jour J</div>' +
      '<div style="background:white;border:1.5px solid var(--gray-light);border-radius:14px;padding:1.25rem;">' +
        '<div class="nutri-timeline">' + tl + '</div>' +
      '</div>' +
    '</div>';
}

    const dotCls = { run:"dot-run", interval:"dot-interval", strength:"dot-strength", long:"dot-long", trail:"dot-trail", rest:"dot-rest" };
    const dots = week.sessions.map(s =>
      `<div class="session-dot ${dotCls[s.type] || 'dot-run'}">${icons[s.type] || '·'}</div>`
    ).join("");

    card.innerHTML = `
      <div class="week-num">SEMAINE ${week.week}</div>
      <div class="week-title-card">${week.title}</div>
      <div class="week-sessions">${dots}</div>
      <div class="week-volume">${week.volume} km</div>
      ${week.recovery ? '<div class="recovery-badge">Récupération</div>' : ''}`;
    grid.appendChild(card);
  });
}

function toggleDetail(week, card) {
  const panel = document.getElementById("detail-panel");
  document.querySelectorAll(".week-card").forEach(c => c.classList.remove("selected"));
  if (panel.classList.contains("visible") && panel.dataset.week === String(week.week) && panel.dataset.prog === currentProg) {
    panel.classList.remove("visible"); return;
  }
  card.classList.add("selected");
  panel.dataset.week = week.week;
  panel.dataset.prog = currentProg;

  const typeLabel = { run:"Footing", interval:"Fractionné", strength:"Renforcement", long:"Longue sortie", trail:"Trail", rest:"Repos actif" };
  const typeCls = { run:"type-run", interval:"type-interval", strength:"type-strength", long:"type-long", trail:"type-trail", rest:"type-rest" };

  const sessionsHTML = week.sessions.map(s => {
    let strengthHTML = "";
    if (s.strength && s.strength.length) {
      const exItems = s.strength.map(ex => `
        <div class="exercise-item">
          <span class="exercise-name">${ex.name}</span>
          <span class="exercise-sets">${ex.sets}</span>
        </div>`).join("");
      strengthHTML = `<div class="strength-block"><div class="strength-block-title">🏋️ Exercices — En salle</div><div class="exercises-grid">${exItems}</div></div>`;
    }
    const detailTags = (s.details || []).map(d => `<span class="session-detail-tag">${d}</span>`).join("");
    return `
      <div class="session-card">
        <div class="session-header">
          <span class="session-type-badge ${typeCls[s.type] || 'type-run'}">${typeLabel[s.type] || s.type}</span>
          <span class="session-day">${s.day}</span>
          <span class="session-name">${s.name}</span>
          <span class="session-duration">${s.duration}</span>
        </div>
        <div class="session-body">
          <div class="session-desc">${s.desc}</div>
          <div class="session-details">${detailTags}</div>
          ${strengthHTML}
        </div>
      </div>`;
  }).join("");

  panel.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-week-num">SEMAINE ${week.week} · ${week.volume} KM</div>
        <div class="detail-title">${week.title}</div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="sessions-list">${sessionsHTML}</div>`;

  panel.classList.add("visible");
  panel.scrollIntoView({ behavior:"smooth", block:"start" });
}

function closeDetail() {
  document.getElementById("detail-panel").classList.remove("visible");
  document.querySelectorAll(".week-card").forEach(c => c.classList.remove("selected"));
}

function renderStats() {
  const prog = PROGRAMS[currentProg];
  const grid = document.getElementById("stats-grid");
  grid.innerHTML = prog.stats.map(s =>
    `<div class="stat-big"><div class="stat-big-val">${s.val}<span class="stat-big-unit">${s.unit}</span></div><div class="stat-big-lbl">${s.lbl}</div></div>`
  ).join("");

  const maxVol = Math.max(...prog.weeks.map(w => w.volume));
  const chart = document.getElementById("volume-chart");
  chart.innerHTML = "";
  prog.weeks.forEach(week => {
    const pct = Math.round((week.volume / maxVol) * 100);
    const wrap = document.createElement("div");
    wrap.className = "chart-bar-wrap";
    wrap.innerHTML = `
      <div class="chart-bar-km">${week.volume}</div>
      <div class="chart-bar${week.recovery ? ' recovery' : ''}" style="height:${pct}%"></div>
      <div class="chart-bar-lbl">S${week.week}</div>`;
    chart.appendChild(wrap);
  });
}

function renderConseils() {
  const prog = PROGRAMS[currentProg];
  document.getElementById("conseils-content").innerHTML = prog.conseils.map(c =>
    `<div class="tip-card">
      <div class="tip-icon" style="background:${c.bg};">${c.icon}</div>
      <div><div class="tip-title">${c.title}</div><div class="tip-text">${c.text}</div></div>
    </div>`
  ).join("");
}

function renderProfil() {
  const prog = PROGRAMS[currentProg];
  document.getElementById("profil-content").innerHTML = `
    <div class="profil-card">${prog.profil.map(p =>
      `<div class="profil-field"><span class="profil-label">${p.lbl}</span><span class="profil-value">${p.val}</span></div>`
    ).join('')}</div>
    <div class="tip-card">
      <div class="tip-icon" style="background:#F5E8EC;">📊</div>
      <div><div class="tip-title">Analyse de votre profil</div><div class="tip-text">${prog.profilNote}</div></div>
    </div>`;
}

// Init
renderAll();
</script>
</body>
</html>
